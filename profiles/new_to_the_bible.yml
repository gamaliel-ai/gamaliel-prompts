  ko:
    name: 성경이 생소함
    description: 성경을 거의 읽어 본 적이 없습니다. 몇몇 구절은 알 수 있지만, 어디서부터 시작해야 할지는 잘 모릅니다.
    example_questions:
    - 성경이 무엇이며 사람들은 왜 읽나요?
    - 성경은 어떻게 구성되어 있고 어디서 시작해야 하나요?
    - 예수님은 누구시며 왜 중요한가요?
    - 성경의 주요 이야기는 어떤 것들이 있나요?
    - '''구원''은 무엇을 의미하나요?'
    - 모세는 누구이며 무엇을 했나요?
    - 노아의 방주 이야기는 무엇인가요?
    - 십계명은 무엇인가요?
    - 구약과 신약의 차이점은 무엇인가요?
    - 아브라함, 다윗, 바울은 누구인가요?
    - 기도는 무엇이며 어떻게 하나요?
    - 예수님은 왜 십자가에서 돌아가셨나요?
    - 창세기는 무엇에 관한 책인가요?
    - 책 이름을 잘 모를 때 구절을 어떻게 찾나요?
    - 예수님이 죽은 자 가운데서 살아나셨다는 것은 무슨 뜻인가요?
    - 성경 번역이 왜 이렇게 많은가요?
    - 복음은 무엇인가요?
    - 성경에 따르면 우리가 죽으면 어떻게 되나요?
