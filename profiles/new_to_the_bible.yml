    - Що означає «спасіння»?
    - Хто такий Мойсей і що він зробив?
    - Яка історія про Ноїв ковчег?
    - Що таке Десять заповідей?
    - У чому різниця між Старим і Новим Завітом?
    - Хто такі Авраам, Давид і Павло?
    - Що таке молитва і як вона працює?
    - Чому Ісус помер на хресті?
    - Про що книга Буття?
    - Як знайти уривок, якщо я ще не знаю книг?
    - Що означає, що Ісус воскрес із мертвих?
    - Чому є стільки різних перекладів Біблії?
    - Що таке Євангеліє?
