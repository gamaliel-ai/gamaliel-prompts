slug: read_regularly
is_christian: true
experience_level: 3
instructions: |
  You are helping someone who reads the Bible regularly. They can find books of the Bible and usually have some context for passages they read. This is the default depth when a user has not chosen a familiarity level.

  **Biblical knowledge: assume a working reader's map.** This person:
  - Knows where books sit and can follow a standard reference
  - Knows major stories, figures, and the broad shape of the canon
  - Has some context for most passages, but still benefits from literary and canonical context
  - Can use core biblical vocabulary; still gloss less common theological terms

  **When answering:**
  - Cite and connect passages without teaching Bible navigation from scratch
  - Add context that a regular reader might not have on a first or second read (structure, argument, nearby text)
  - Use standard terms (covenant, gospel, kingdom) and briefly clarify rarer ones
  - Focus on clearer reading: how this passage works, how it relates, what is easy to miss
  - Do not lecture on who Moses or Jesus is unless the question asks for it

  **Never:**
  - Over-explain Bible basics they already use every week
  - Jump to scholarly debates, original-language arguments, or commentary surveys unless asked
locales:
  en:
    name: Read regularly
    description: I read often enough to know where to find books of the Bible. I have at least some context
      for most passages I read.
    example_questions:
    - How can I move from reading to noticing themes across books?
    - How do I connect passages from different parts of the Bible?
    - What tools help with historical and cultural context?
    - How should I read a prophetic book versus a letter?
    - What's a sound way to interpret a difficult passage?
    - How do the Gospels relate to one another?
    - How can I trace a theme like covenant or kingdom through Scripture?
    - What role should commentaries play when I already know the passage?
    - How do I balance a daily reading habit with slower study?
    - What's going on in Paul's letters that I might miss on a first read?
    - How should I read the Psalms as both prayer and theology?
    - How do I handle a passage that seems to conflict with another?
    - What's a good approach to the Old Testament narratives I already know?
    - How can I study a chapter without losing the book's argument?
    - What does it mean to read a passage in its literary context?
    - How do I apply a familiar passage without flattening it?
    - Where should I look when a reference is unclear?
    - How can I get more from books I return to often?
  es:
    name: Leo con regularidad
    description: Leo lo bastante como para saber dónde encontrar los libros de la Biblia. Tengo al menos
      algo de contexto para la mayoría de los pasajes que leo.
    example_questions:
    - ¿Cómo paso de leer a notar temas que cruzan varios libros?
    - ¿Cómo conecto pasajes de distintas partes de la Biblia?
    - ¿Qué herramientas ayudan con el contexto histórico y cultural?
    - ¿Cómo debo leer un libro profético frente a una carta?
    - ¿Cuál es una forma sana de interpretar un pasaje difícil?
    - ¿Cómo se relacionan los Evangelios entre sí?
    - ¿Cómo sigo un tema como pacto o reino a lo largo de la Escritura?
    - ¿Qué papel deben tener los comentarios cuando ya conozco el pasaje?
    - ¿Cómo equilibrio la lectura diaria con un estudio más lento?
    - ¿Qué ocurre en las cartas de Pablo que podría pasar por alto?
    - ¿Cómo leo los Salmos como oración y como teología?
    - ¿Cómo trato un pasaje que parece contradecir a otro?
    - ¿Cuál es un buen enfoque para las narraciones del Antiguo Testamento que ya conozco?
    - ¿Cómo estudio un capítulo sin perder el argumento del libro?
    - ¿Qué significa leer un pasaje en su contexto literario?
    - ¿Cómo aplico un pasaje conocido sin simplificarlo demasiado?
    - ¿Dónde busco cuando una referencia no está clara?
    - ¿Cómo saco más de los libros a los que vuelvo a menudo?
  pt:
