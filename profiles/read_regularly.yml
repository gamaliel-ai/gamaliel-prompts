    example_questions:
    - Como passo de ler para perceber temas que atravessam os livros?
    - Como conecto passagens de partes diferentes da Bíblia?
    - Quais ferramentas ajudam com o contexto histórico e cultural?
    - Como ler um livro profético em comparação com uma carta?
    - Qual é um jeito são de interpretar uma passagem difícil?
    - Como os Evangelhos se relacionam uns com os outros?
    - Como rastrear um tema como aliança ou reino nas Escrituras?
    - Que papel os comentários devem ter quando eu já conheço a passagem?
    - Como equilibrar a leitura diária com um estudo mais lento?
    - O que acontece nas cartas de Paulo que eu posso perder numa primeira leitura?
    - Como ler os Salmos como oração e como teologia?
    - Como lidar com uma passagem que parece conflitar com outra?
    - Qual é uma boa abordagem para as narrativas do Antigo Testamento que eu já conheço?
    - Como estudar um capítulo sem perder o argumento do livro?
    - O que significa ler uma passagem no seu contexto literário?
    - Como aplicar uma passagem familiar sem achatá-la?
    - Onde procurar quando uma referência não está clara?
    - Como aproveitar mais os livros aos quais eu volto com frequência?
  ko:
    name: 정기적으로 읽음
    description: 성경의 책들이 어디에 있는지 알 만큼 자주 읽습니다. 읽는 대부분의 본문에 어느 정도 맥락이 있습니다.
    example_questions:
    - 읽기를 넘어서 여러 권에 걸친 주제를 어떻게 알아채나요?
    - 성경의 다른 부분에 있는 구절을 어떻게 연결하나요?
    - 역사적·문화적 배경을 보는 데 어떤 도구가 도움이 되나요?
    - 예언서와 서신은 어떻게 다르게 읽어야 하나요?
    - 어려운 본문을 건전하게 해석하는 방법은 무엇인가요?
    - 복음서들은 서로 어떻게 관련되나요?
    - 언약이나 나라 같은 주제를 성경 전체에서 어떻게 따라가나요?
    - 이미 아는 본문을 볼 때 주석의 역할은 무엇인가요?
    - 매일 읽기와 더 느린 연구를 어떻게 균형 맞추나요?
    - 바울 서신에서 첫 읽기에 놓치기 쉬운 것은 무엇인가요?
    - 시편을 기도와 신학으로 함께 읽으려면 어떻게 하나요?
    - 다른 구절과 충돌해 보이는 본문은 어떻게 다루나요?
    - 이미 아는 구약 내러티브는 어떻게 접근하면 좋나요?
    - 책의 논지를 잃지 않고 한 장을 공부하려면?
    - 문학적 맥락에서 본문을 읽는다는 것은 무슨 뜻인가요?
    - 익숙한 본문을 납작하게 만들지 않고 적용하려면?
    - 참조가 분명하지 않을 때 어디를 보나요?
    - 자주 다시 읽는 책에서 더 얻으려면 어떻게 하나요?
  ar:
    name: أقرأ بانتظام
    description: أقرأ بما يكفي لأعرف أين أجد أسفار الكتاب المقدس. لدي على الأقل بعض السياق لمعظم المقاطع
      التي أقرأها.
    example_questions:
    - كيف أنتقل من القراءة إلى ملاحظة موضوعات عبر الأسفار؟
    - كيف أصل مقاطع من أجزاء مختلفة من الكتاب المقدس؟
    - ما الأدوات التي تساعد في السياق التاريخي والثقافي؟
    - كيف أقرأ سفراً نبوياً مقارنة برسالة؟
    - ما الطريقة السليمة لتفسير مقطع صعب؟
    - كيف ترتبط الأناجيل بعضها ببعض؟
    - كيف أتتبع موضوعاً مثل العهد أو الملكوت في الكتاب المقدس؟
    - ما دور التفاسير عندما أعرف المقطع مسبقاً؟
    - كيف أوازن بين القراءة اليومية والدراسة الأبطأ؟
    - ماذا يجري في رسائل بولس وقد أفوته في القراءة الأولى؟
    - كيف أقرأ المزامير كصلاة وكلاهوت؟
    - كيف أتعامل مع مقطع يبدو متعارضاً مع آخر؟
    - ما مقاربة جيدة لروايات العهد القديم التي أعرفها؟
    - كيف أدرس أصحاحاً دون أن أفقد حجة السفر؟
    - ماذا يعني قراءة مقطع في سياقه الأدبي؟
    - كيف أطبّق مقطعاً مألوفاً دون تسطيحه؟
    - أين أبحث عندما يكون المرجع غير واضح؟
    - كيف أستفيد أكثر من الأسفار التي أعود إليها كثيراً؟
  uk:
    name: Читаю регулярно
    description: Я читаю досить часто, щоб знати, де знайти книги Біблії. Для більшості уривків маю бодай
      якийсь контекст.
    example_questions:
    - Як перейти від читання до помічання тем у різних книгах?
    - Як поєднувати уривки з різних частин Біблії?
    - Які інструменти допомагають з історичним і культурним контекстом?
    - Як читати пророчу книгу порівняно з посланням?
    - Як здорово тлумачити складний уривок?
    - Як Євангелія співвідносяться одне з одним?
    - Як простежити тему завіту чи царства крізь Писання?
    - Яку роль мають коментарі, коли я вже знаю уривок?
    - Як поєднати щоденне читання з повільнішим вивченням?
    - Що в посланнях Павла можна пропустити з першого читання?
    - Як читати Псалми і як молитву, і як богослов’я?
    - Як ставитися до уривка, що ніби суперечить іншому?
    - Як підходити до старозавітних оповідей, які я вже знаю?
    - Як вивчати розділ, не втрачаючи аргументу книги?
    - Що означає читати уривок у літературному контексті?
    - Як застосувати знайомий уривок, не спрощуючи його?
    - Куди дивитися, коли посилання неясне?
    - Як отримати більше від книг, до яких я часто повертаюся?
